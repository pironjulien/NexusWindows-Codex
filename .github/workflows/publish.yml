name: Publish to npm

# Trusted Publishing (OIDC): no token stored in the repository. npm side, once: a trusted publisher for this repository,
# workflow publish.yml, environment npm; then set the repository variable NPM_PUBLISH to true. From then on, a published
# GitHub release vX.Y.Z uploads that version with provenance (before that, releases only build and check), then
# publishes server.json to the official MCP registry (GitHub OIDC login, namespace io.github.pironjulien).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false  # a release build never reuses a cache another run could have written
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Version matches the release tag, README carries the MCP registry name
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "package version: $version"
          if ($env:EVENT_NAME -eq 'release' -and $env:TAG -ne "v$version") { throw "Tag $env:TAG does not match v$version" }
          if (-not (Select-String -Path README.md -SimpleMatch 'mcp-name: io.github.pironjulien/nexus-windows-codex' -Quiet)) { throw 'README lacks the mcp-name line' }
      - name: Native helper, self-contained single file (no .NET install needed)
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'helper'
          dotnet publish native/NexusCodex.UIA.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o native/bin `
            "-p:BaseIntermediateOutputPath=$work\obj\" "-p:BaseOutputPath=$work\bin\" --nologo -v q
          if ($LASTEXITCODE -or -not (Test-Path native/bin/NexusCodex.UIA.exe)) { throw 'Native helper build failed' }
          Remove-Item native/bin/*.pdb -ErrorAction SilentlyContinue
      - name: Tests (startup of the command included), then pack
        shell: pwsh
        run: |
          node --test tests/*.test.mjs
          if ($LASTEXITCODE) { throw 'Tests failed' }
          New-Item -ItemType Directory -Force dist | Out-Null  # npm pack does not create its destination
          npm pack --pack-destination dist
          if ($LASTEXITCODE) { throw 'npm pack failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/nexus-windows-codex
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm 11 (trusted publishing)
        run: npm install --global npm@11.6.2
      - name: Publish with provenance
        shell: bash
        # A version already on npm (published by hand, or a re-run) is left as is, so the registry step can still run.
        run: |
          version=$(python3 -c "import json; print(json.load(open('server.json'))['version'])" 2>/dev/null || true)
          tarball=$(ls dist/*.tgz)
          version=${version:-$(basename "$tarball" .tgz | sed 's/^nexus-windows-codex-//')}
          if npm view "nexus-windows-codex@$version" version >/dev/null 2>&1; then
            echo "nexus-windows-codex $version is already on npm: nothing to publish"
          else
            npm publish "./$tarball" --access public --provenance
          fi

  registry:
    # After the version reaches npm: server.json to the official MCP registry. mcp-publisher pinned by version and
    # SHA-256; no token stored, no manual login.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PUBLISHER_VERSION: v1.8.1
      PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait until npm serves the version in server.json
        shell: bash
        run: |
          version=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do
            curl -fsS "https://registry.npmjs.org/nexus-windows-codex/$version" >/dev/null && exit 0
            sleep 20
          done
          echo "nexus-windows-codex $version is not on npm"; exit 1
      - name: Install mcp-publisher (pinned, checksum verified)
        shell: bash
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum --strict -c
          tar xzf mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish server.json
